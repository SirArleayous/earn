<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multi-Country Configuration | SINEX Admin</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body>
<div class="dashboard-layout">
  <main class="main-content">
    <h2>Pan-African Market Management</h2>
    
    <div class="card" style="margin-top: 1.5rem;">
      <table class="data-table">
        <thead>
          <tr>
            <th>Country</th>
            <th>Currency Code</th>
            <th>Symbol</th>
            <th>Exchange Rate (1 NGN)</th>
            <th>Market Status</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>🇳🇬 Nigeria</td>
            <td>NGN</td>
            <td>₦</td>
            <td>1.00</td>
            <td><span class="badge badge-success">Active</span></td>
          </tr>
          <tr>
            <td>🇰🇪 Kenya</td>
            <td>KES</td>
            <td>KSh</td>
            <td>0.095</td>
            <td><span class="badge badge-success">Active</span></td>
          </tr>
          <tr>
            <td>🇬🇭 Ghana</td>
            <td>GHS</td>
            <td>GH₵</td>
            <td>0.012</td>
            <td><span class="badge badge-warning">Beta Launch</span></td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>
<script src="../assets/js/main.js"></script>
</body>
</html>
