<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Referrals & Profile | SINEX</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body>
<div class="dashboard-layout">
  <main class="main-content" style="max-width: 700px;">
    <div class="card" style="margin-bottom: 2rem;">
      <h3>Your Referral Network</h3>
      <p style="color: var(--text-muted); font-size: 0.875rem;">Share your code and earn 5% bonus on task completions.</p>
      <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
        <input type="text" readonly value="https://sinex.africa/register?ref=ALEX2026" style="flex: 1; padding: 0.5rem; border: 1px solid var(--border); border-radius: 4px;">
        <button class="btn btn-primary" onclick="SINEX.showToast('Referral link copied!')">Copy Link</button>
      </div>
    </div>

    <div class="card">
      <h3>User Profile Information</h3>
      <form style="margin-top: 1rem;" onsubmit="event.preventDefault(); SINEX.showToast('Profile updated!');">
        <div style="margin-bottom: 1rem;">
          <label style="font-size: 0.85rem; font-weight: 600;">Full Name</label>
          <input type="text" value="Alex Kwame" style="width: 100%; padding: 0.6rem; border: 1px solid var(--border); border-radius: 4px;">
        </div>
        <div style="margin-bottom: 1rem;">
          <label style="font-size: 0.85rem; font-weight: 600;">Primary Phone</label>
          <input type="text" value="+234 812 345 6789" style="width: 100%; padding: 0.6rem; border: 1px solid var(--border); border-radius: 4px;">
        </div>
        <button class="btn btn-primary">Save Profile Changes</button>
      </form>
    </div>
  </main>
</div>
<script src="../assets/js/main.js"></script>
</body>
</html>
