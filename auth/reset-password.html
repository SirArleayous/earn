<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>New Password | SINEX</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body class="auth-container">
  <div class="auth-card">
    <h2>Set New Password</h2>
    <form style="margin-top: 1.5rem;" onsubmit="event.preventDefault(); SINEX.showToast('Password reset successful!'); setTimeout(() => window.location.href='login.html', 1000);">
      <div style="margin-bottom: 1rem;">
        <label style="font-size: 0.85rem; font-weight: 600;">New Password</label>
        <input type="password" required style="width: 100%; padding: 0.65rem; border: 1px solid var(--border); border-radius: 4px;">
      </div>
      <div style="margin-bottom: 1.5rem;">
        <label style="font-size: 0.85rem; font-weight: 600;">Confirm New Password</label>
        <input type="password" required style="width: 100%; padding: 0.65rem; border: 1px solid var(--border); border-radius: 4px;">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%;">Update Password</button>
    </form>
  </div>
  <script src="../assets/js/main.js"></script>
</body>
</html>
