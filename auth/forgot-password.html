<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password | SINEX</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg-main);">
  <div class="card" style="width:100%; max-width:420px; padding:2rem;">
    <h2 style="margin-bottom:0.5rem;">Reset Password</h2>
    <p style="font-size:0.875rem; color:var(--text-muted); margin-bottom:1.5rem;">Enter your email to receive recovery instructions.</p>
    <form onsubmit="event.preventDefault(); SINEX.showToast('Password reset link sent to your email!');">
      <div style="margin-bottom:1rem;">
        <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom:0.3rem;">Email Address</label>
        <input type="email" required style="width:100%; padding:0.65rem; border:1px solid var(--border); border-radius:var(--radius-sm);">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Send Reset Link</button>
    </form>
    <div style="margin-top:1rem; text-align:center; font-size:0.85rem;">
      <a href="login.html">Back to Login</a>
    </div>
  </div>
  <script src="../assets/js/main.js"></script>
</body>
</html>
